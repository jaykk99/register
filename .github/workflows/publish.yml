name: Publish

on:
    push:
        branches: [main]
        paths:
            - "domains/*"
            - ".github/workflows/publish.yml"
            - "util/reserved.json"
            - "dnsconfig.js"

    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-publish

jobs:
    dns:
        name: DNS
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Generate creds.json
              run: echo '{"cloudflare":{"TYPE":"CLOUDFLAREAPI","apitoken":"$CLOUDFLARE_API_TOKEN"}}' > ./creds.json

            - name: Install dnscontrol
              run: |
                  curl -sL -o /tmp/dnscontrol.tar.gz "https://github.com/StackExchange/dnscontrol/releases/download/v5.7.2/dnscontrol_5.7.2_linux_amd64.tar.gz"
                  tar xzf /tmp/dnscontrol.tar.gz -C /tmp dnscontrol
                  sudo install -m 755 /tmp/dnscontrol /usr/local/bin/dnscontrol

            - name: Push DNS records
              run: dnscontrol push
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
